name: CI-CD

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python -m pytest -q

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build

  images:
    name: Build and push images (GHCR)
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Lowercase owner
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/pms-backend:${{ github.sha }}
            ghcr.io/${{ env.OWNER }}/pms-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/pms-web:${{ github.sha }}
            ghcr.io/${{ env.OWNER }}/pms-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  deploy:
    name: Deploy to my PC
    needs: [images]
    # Runs only on pushes to dev, and only after you switch it on (repo variable ENABLE_DEPLOY=true).
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev' && vars.ENABLE_DEPLOY == 'true'
    runs-on: self-hosted
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4

      # Windows runner: use PowerShell (plain "bash" resolves to WSL and cannot read the runner's script path).
      # Native commands write progress to stderr, so errors are checked via $LASTEXITCODE instead.
      - name: Write .env from GitHub Secrets
        run: |
          $owner = "${{ github.repository_owner }}".ToLower()
          $lines = @(
            'MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}',
            'MYSQL_DATABASE=${{ secrets.MYSQL_DATABASE }}',
            'MYSQL_USER=${{ secrets.MYSQL_USER }}',
            'MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }}',
            'SECRET_KEY=${{ secrets.SECRET_KEY }}',
            'CORS_ORIGINS=${{ secrets.CORS_ORIGINS }}',
            "GHCR_OWNER=$owner",
            'IMAGE_TAG=${{ github.sha }}'
          )
          [IO.File]::WriteAllText("$PWD\.env", ($lines -join "`n") + "`n")

      - name: Get images (GHCR pull, else build locally)
        run: |
          $ErrorActionPreference = 'Continue'
          "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker compose pull backend web
          if ($LASTEXITCODE -ne 0) {
            Write-Output "GHCR pull failed (package private or login denied). Building images on this PC instead."
            docker compose build backend web
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          exit 0

      - name: Start containers
        run: |
          $ErrorActionPreference = 'Continue'
          docker compose up -d --remove-orphans --no-build

      - name: Run database migrations
        run: |
          $ErrorActionPreference = 'Continue'
          # the backend container may still be starting, so retry for a while
          for ($i = 0; $i -lt 20; $i++) {
            docker compose exec -T backend alembic upgrade head
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Start-Sleep -Seconds 3
          }
          docker compose logs --tail=50 backend
          exit 1

      - name: Health check
        run: |
          $ErrorActionPreference = 'Continue'
          for ($i = 0; $i -lt 30; $i++) {
            try {
              $r = Invoke-WebRequest -UseBasicParsing -Uri http://localhost:8080/api/v1/health
              if ($r.StatusCode -eq 200) { Write-Output $r.Content; exit 0 }
            } catch { }
            Start-Sleep -Seconds 3
          }
          docker compose logs --tail=100
          exit 1

      - name: Show public URL
        run: |
          $ErrorActionPreference = 'Continue'
          Start-Sleep -Seconds 12
          $m = docker compose logs cloudflared 2>&1 | Select-String -Pattern 'https://[a-z0-9-]+\.trycloudflare\.com' -AllMatches
          if ($m) {
            $url = $m[-1].Matches[-1].Value
            "PUBLIC URL: $url"
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "### Public URL`n$url"
          } else { "Tunnel URL not ready yet: run 'docker compose logs cloudflared'" }
          exit 0

name: CI-CD

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python -m pytest -q

  # Frontend job (lint, test, build) will be added on Day 5/6.

  deploy:
    name: Deploy to my PC
    needs: [backend]
    # Runs only on pushes to dev, and only after you switch it on (see Step 3).
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev' && vars.ENABLE_DEPLOY == 'true'
    runs-on: self-hosted
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Write .env from GitHub Secrets
        run: |
          cat > .env <<EOF
          MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE=${{ secrets.MYSQL_DATABASE }}
          MYSQL_USER=${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }}
          SECRET_KEY=${{ secrets.SECRET_KEY }}
          CORS_ORIGINS=${{ secrets.CORS_ORIGINS }}
          EOF

      - name: Build and start containers
        run: docker compose up -d --build --remove-orphans

      - name: Run database migrations
        run: docker compose exec -T backend alembic upgrade head

      - name: Health check
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/api/v1/health; then exit 0; fi
            sleep 3
          done
          docker compose logs --tail=100
          exit 1